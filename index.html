  <style>
    /* Aesthetic Color Palette & Typography */
    body { font-family: 'Segoe UI', system-ui, sans-serif; padding: 15px; background-color: #eef2f5; margin: 0; color: #334155; transition: background-color 0.4s ease; }
    
    .container { max-width: 500px; margin: auto; background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); min-height: 80vh; border-top: 6px solid #4a90e2; position: relative; }
    .table-container-wrapper { max-width: 100%; overflow-x: auto; margin: auto; background: #ffffff; padding: 10px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); min-height: 80vh; border-top: 6px solid #64748b; }
    
    /* School Branding Headers */
    .school-name { text-align: center; color: #1e3a8a; margin: 0 0 5px 0; font-size: 22px; font-weight: 800; letter-spacing: 0.5px; }
    .event-name { text-align: center; color: #4338ca; margin: 0 0 5px 0; font-size: 18px; font-weight: 600; }
    .test-name { text-align: center; color: #64748b; margin: 0 0 20px 0; font-size: 16px; font-weight: 500; }
    
    .divider { border: 0; border-top: 1px solid #e2e8f0; margin: 25px 0 15px 0; }
    
    /* Page Titles */
    h2 { text-align: center; color: #334155; margin-top: 0; margin-bottom: 5px; font-size: 20px; }
    h3 { color: #64748b; text-align: center; margin-bottom: 20px; margin-top: 5px; font-weight: normal; font-size: 16px; }
    
    /* Page Navigation */
    .page { display: none; }
    .page.active { display: block; animation: fadeIn 0.3s; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    
    /* Grids for Buttons */
    .button-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
    .list-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 15px; }
    
    /* Inputs */
    input[type="password"], input[type="text"], input[type="number"] {
        width: 100%; padding: 14px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; box-sizing: border-box; background-color: #f8fafc;
    }
    input:focus { outline: none; border-color: #3b82f6; background-color: #ffffff; }

    /* CUSTOM IN-APP DROPDOWN SYSTEM */
    .custom-select-container { position: relative; width: 100%; margin-bottom: 15px; }
    .custom-select-display {
        width: 100%; padding: 14px; border: 1px solid #cbd5e1; border-radius: 8px; 
        font-size: 16px; background-color: #f8fafc; color: #94a3b8; cursor: pointer;
        box-sizing: border-box; text-align: left; display: flex; justify-content: space-between; align-items: center;
        transition: 0.2s;
    }
    .custom-select-display.has-value { color: #1e293b; background-color: #ffffff; border-color: #3b82f6; }
    .custom-select-display::after { content: '▼'; font-size: 12px; color: #94a3b8; margin-left: 10px; }
    .custom-select-options {
        position: absolute; top: 100%; left: 0; right: 0; background: #ffffff; 
        border: 1px solid #cbd5e1; border-radius: 8px; margin-top: 4px; z-index: 1000;
        max-height: 250px; overflow-y: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        display: none;
    }
    .custom-select-options.show { display: block; animation: fadeIn 0.2s; }
    .custom-select-option { padding: 12px 14px; font-size: 16px; color: #334155; cursor: pointer; border-bottom: 1px solid #f1f5f9; }
    .custom-select-option:last-child { border-bottom: none; }
    .custom-select-option:hover { background-color: #f1f5f9; color: #3b82f6; font-weight:bold; }

    /* Custom Calendar Styles */
    .calendar { border: 1px solid #cbd5e1; border-radius: 8px; background: white; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-weight: bold; font-size: 18px; color: #1e293b; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
    .calendar-day-name { font-size: 13px; color: #64748b; font-weight: bold; padding-bottom: 5px; border-bottom: 1px solid #e2e8f0; margin-bottom: 5px; }
    .calendar-day { padding: 10px 0; border-radius: 6px; cursor: pointer; font-size: 15px; transition: 0.2s; border: 1px solid transparent; color: #334155; }
    .calendar-day:hover:not(.empty):not(.disabled) { background-color: #f1f5f9; border-color: #cbd5e1; }
    .calendar-day.weekend { background-color: #dcfce3; color: #15803d; font-weight: bold; }
    .calendar-day.selected { background-color: #8b5cf6 !important; color: white !important; font-weight: bold; border-color: #7c3aed !important; box-shadow: 0 2px 4px rgba(139, 92, 246, 0.3); }
    .calendar-day.empty { cursor: default; }
    .calendar-day.disabled { color: #cbd5e1; cursor: not-allowed; background-color: #f8fafc; text-decoration: line-through; }
    
    .date-display-box { width: 100%; padding: 14px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; box-sizing: border-box; background-color: #f8fafc; text-align: center; color: #64748b; font-weight: bold; transition: 0.3s; }
    .date-display-box.active { color: #8b5cf6; border-color: #8b5cf6; background-color: #f5f3ff; }
    
    /* Button Styles */
    button { padding: 15px; font-size: 16px; font-weight: 600; cursor: pointer; border: none; border-radius: 8px; transition: all 0.15s ease; position: relative; }
    
    .nav-btn, .page1-div, .full-div, .top10-div, .progress-div, .sub-1, .sub-2, .sub-3, .sub-4, .sub-5, .sub-6, .sub-7, .sub-8, .sub-9 { background-color: #ffffff !important; color: #334155; border: 1px solid #cbd5e1; box-shadow: 0 4px 0 #94a3b8, 0 5px 10px rgba(0,0,0,0.05); }
    .nav-btn:hover:not(.disabled-btn) { transform: translateY(-2px); box-shadow: 0 6px 0 #94a3b8, 0 8px 15px rgba(0,0,0,0.1); }
    .nav-btn:active:not(.disabled-btn) { transform: translateY(4px); box-shadow: 0 0 0 transparent !important; }

    .disabled-btn { background-color: #f1f5f9 !important; color: #94a3b8 !important; border-color: #e2e8f0 !important; box-shadow: none !important; cursor: not-allowed !important; transform: none !important; }
    
    .action-btn { background-color: #ffffff; color: #3b82f6; width: 100%; margin-top: 15px; font-size: 18px; border: 2px solid #3b82f6; box-shadow: 0 4px 0 #2563eb, 0 5px 15px rgba(59, 130, 246, 0.2); }
    .action-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #2563eb, 0 8px 20px rgba(59, 130, 246, 0.3); }
    .action-btn:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; }
    
    .admin-btn { background-color: #ffffff; color: #64748b; border: 2px solid #94a3b8; width: 100%; font-size: 16px; margin-top: 15px; box-shadow: 0 4px 0 #cbd5e1, 0 5px 10px rgba(0,0,0,0.05); }
    .admin-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #cbd5e1, 0 8px 15px rgba(0,0,0,0.1); }
    .admin-btn:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; }

    .edit-btn { background-color: #ffffff; color: #f59e0b; width: 100%; margin-top: 25px; font-size: 18px; display: none; border: 2px solid #f59e0b; box-shadow: 0 4px 0 #d97706, 0 5px 15px rgba(245, 158, 11, 0.2); }
    .edit-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #d97706, 0 8px 20px rgba(245, 158, 11, 0.3); }
    .edit-btn:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; }
    
    .report-btn { background-color: #ffffff; color: #92400e; border: 2px solid #fcd34d; width: 100%; font-size: 16px; box-shadow: 0 4px 0 #fcd34d, 0 5px 10px rgba(0,0,0,0.05); }
    .report-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #fcd34d, 0 8px 15px rgba(0,0,0,0.1); }
    .report-btn:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; }
    
    .back-btn { background-color: transparent; color: #3b82f6; padding: 0; margin-bottom: 10px; font-size: 15px; width: auto; font-weight: bold; box-shadow: none !important; transform: none !important; border: none; }
    .back-btn:hover { color: #2563eb; transform: translateX(-3px) !important; box-shadow: none !important; }
    .back-btn:active { transform: translateX(0) !important; }

    .logout-text-btn { display: block; width: 100%; text-align: right; color: #ef4444; font-size: 14px; font-weight: bold; background: transparent; border: none; box-shadow: none; padding: 0; margin-bottom: 15px; cursor: pointer; transition: 0.2s; }
    .logout-text-btn:hover { text-decoration: underline; color: #dc2626; transform: none; box-shadow: none; }

    /* Student List Form */
    .student-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
    .student-name { font-size: 15px; font-weight: 500; color: #475569; flex: 1; padding-right: 15px; text-align: left; line-height: 1.3; word-break: break-word; }
    .mark-input { width: 45px !important; padding: 8px 4px !important; margin: 0 !important; font-size: 16px; border: 1px solid #cbd5e1; border-radius: 6px; text-align: center; color: #1e293b; font-weight: bold; background-color: #f8fafc; transition: border-color 0.2s; }
    .mark-input:focus { outline: none; border-color: #3b82f6 !important; background-color: #ffffff !important; }
    .mark-input:disabled { background-color: #e2e8f0 !important; color: #64748b !important; border-color: #e2e8f0 !important; cursor: not-allowed; }
    
    #message, #loginMessage, #setupPinMessage, #adminAuthMessage, #adminDashMessage { text-align: center; font-weight: bold; margin-top: 20px; min-height: 24px; padding: 10px; border-radius: 6px; }

    /* Data Table Styles */
    .table-responsive { width: 100%; overflow-x: auto; margin-top: 15px; border-radius: 8px; border: 1px solid #e2e8f0; }
    .marks-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .marks-table th, .marks-table td { padding: 8px 4px; border-bottom: 1px solid #e2e8f0; border-right: 1px solid #e2e8f0; text-align: center; color: black; }
    .marks-table th { background-color: #f8fafc; font-weight: normal; white-space: normal; line-height: 1.2; font-size: 12px; border: 1px solid #000; }
    .marks-table td { border: 1px solid #000; }
    .marks-table td:first-child, .marks-table th:first-child { text-align: left; white-space: nowrap; padding-left: 8px; }
    .marks-table tr { page-break-inside: avoid; } 
    
    /* Divided Batch Specific Styles */
    .batch-header { color: #000; padding: 10px 0; font-weight: bold; text-align: center; font-size: 18px; margin-bottom: 5px; text-transform: uppercase; }

    #loadingIndicator { text-align: center; color: #3b82f6; font-weight: bold; margin: 30px 0; font-size: 18px; }
    .developer-credit { text-align: center; margin-top: 20px; font-size: 13px; color: #94a3b8; font-weight: 500; letter-spacing: 0.3px; }

    /* Container for Offscreen PDF generation */
    #pdfDownloadArea { position: absolute; top: -9999px; left: -9999px; width: 297
